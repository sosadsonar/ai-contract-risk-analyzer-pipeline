[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-risk-analyzer"
version = "0.1.0"
description = "Hệ thống AI phân tích rủi ro hợp đồng lao động"
authors = [
    { name = "Ngọ Bùi Đức Anh", email = "24021368@vnu.edu.vn" },
    { name = "Nguyễn Huy Minh", email = "24021572@vnu.edu.vn"},
    { name = "Ngô Hoàng Nhật", email = "24021588@vnu.edu.vn" },
    { name = "Cao Khắc Phan Sang", email = "24021612@vnu.edu.vn" },
    { name = "Hoàng Phạm Anh Tú", email = "24021652@vnu.edu.vn" }

]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    # AI & Core Pipeline
    "pydantic>=2.0",        # Data validation & Structured Output (Cực quan trọng)
    "requests>=2.31.0",     # Transport REST cho Gemini (gemini_client) và Ollama dev (dev_local_client)
    
    # Backend & API (Cho nhóm Backend)
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.9", # Xử lý upload file / form data qua API
    "httptools>=0.6.0",     # Parser HTTP tốc độ cao cho uvicorn
    "watchfiles>=0.21.0",   # Auto-reload cho uvicorn
    "websockets>=12.0",     # Hỗ trợ WebSocket cho uvicorn
    
    
    # Document Processing & Utilities
    "pymupdf>=1.24.0",      # Xử lý và trích xuất text từ PDF hợp đồng
    "pydantic-settings>=2.0.0", # Quản lý settings/config từ biến môi trường
    "python-docx>=1.1",
    "lxml>=5.0",
    "rank-bm25>=0.2",
    "pyyaml>=6.0",          # Đọc ghi cấu hình định dạng YAML
    "python-dotenv>=1.0.0", # Quản lý biến môi trường (.env)
]

[project.optional-dependencies]
dev = [
    "scikit-learn>=1.3.0",  # Dùng cho file eval_segmentation.py để tính F1
    "pytest>=9.1.1",          # Viết unit test cho code
    "jsonschema>=4.20",     # Test hợp đồng JSON Schema (tests/contract)
    "pytest-asyncio>=0.24",
    "httpx2>=2.13",         # httpx is deprecated
    "ruff>=0.1.0",          # Linter & Formatter code siêu nhanh (Thay thế Flake8/Black)
]
test = [
    "pytest-asyncio>=1.4.1"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "ai_pipeline*"]  # Chỉ đóng gói các module code thực thi
exclude = ["frontend*", "notebooks*", "tests*", "docs*"]

[tool.setuptools.package-data]
"backend.app.session" = ["fixtures/*.json"]

# --- CẤU HÌNH TOOL CHO TEAM ---
[tool.ruff]
line-length = 150
target-version = "py310"
exclude = [".git", "__pycache__", "venv", "env", ".venv"]
# Submodule dữ liệu (repo của Người 2) có lint/CI riêng, không lint từ repo này.
extend-exclude = ["ai_pipeline/data"]

[tool.ruff.lint]
select = ["E", "F", "I"]  # Bật kiểm tra lỗi cơ bản và tự động sort import (I)
ignore = []

[tool.ruff.lint.per-file-ignores]
# Văn bản prompt/định nghĩa nhãn tiếng Việt và dữ liệu tổng hợp: ngắt dòng làm đổi nội dung/pin.
"backend/app/ai/prompts/*.py" = ["E501"]
"ai_pipeline/eval/fixtures/build_synthetic.py" = ["E501"]
"tests/llm/_synthetic.py" = ["E501"]

# Cấu hình Pytest
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q -m \"not llm and not llm_local\""
markers = [
    "llm: gọi LLM thật qua API (cần GEMINI_API_KEY; chạy bằng `pytest -m llm`)",
    "llm_local: gọi model cục bộ qua Ollama (cần OLLAMA_MODEL + Ollama đang chạy; chạy bằng `pytest -m llm_local`)",
]
# "." để import ai_pipeline.*; "backend" để import app.* (cùng cách backend chạy: app.main)
pythonpath = [".", "backend"]
testpaths = [
    "tests",
    "backend/tests",
]
asyncio_mode = "auto"