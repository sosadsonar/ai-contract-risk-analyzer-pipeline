# CI kiểm thử tự động (PROGRESS.md tuần 1 — N4 C-17 "CI chạy pytest"; N1 dựng ở tuần 2).
#
# 4 job (+ llm-live thủ công):
#   test  — pytest trên Python 3.10 (cận dưới pyproject) và 3.12 (bản chạy thật, AI_CONTEXT §8) +
#           smoke script không cần API key. KHÔNG kéo submodule, KHÔNG cần secret, KHÔNG gọi LLM.
#   data  — kéo submodule `ai_pipeline/data` rồi chạy test cần dữ liệu thật (tests/test_data_lead_review.py,
#           tests/integration). Không kéo được submodule ⇒ ĐỎ trên push/PR cùng repo (chỉ PR từ fork được bỏ qua);
#           đặt secret SUBMODULE_TOKEN (PAT chỉ đọc repo data) để chạy.
#   lint  — ruff toàn repo, chặn cứng.
#   frontend — vitest + vite build (N5).
#
# Job `test`/`data` KHÔNG gọi LLM. pytest gom cả `tests/` và `backend/tests/` (pyproject testpaths).
# Test gọi LLM thật nằm ở job `llm-live` riêng: chỉ chạy tay (Actions → CI → Run workflow) và chỉ khi
# repo có secret GEMINI_API_KEY; dùng văn bản tổng hợp, không gửi hợp đồng thật (AI_CONTEXT §3).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_llm:
        description: "Chạy thêm job llm-live (gọi Gemini thật, tốn quota)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cài đặt (pyproject, extra dev)
        run: pip install -e '.[dev]'

      # test_data_lead_review.py cần submodule → chạy ở job `data`.
      # tests/integration tự skip khi thiếu submodule.
      - name: pytest (không cần submodule)
        run: pytest --ignore=tests/test_data_lead_review.py --junitxml=pytest-report.xml

      - name: Smoke toàn pipeline với provider giả (không cần API key)
        run: python scripts/smoke_pipeline.py

      - name: Tải báo cáo test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-py${{ matrix.python-version }}
          path: pytest-report.xml
          if-no-files-found: ignore
          retention-days: 7

  data:
    name: test cần dữ liệu (submodule)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (cố kéo submodule)
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      - name: Checkout không submodule (dự phòng)
        if: steps.checkout.outcome != 'success'
        uses: actions/checkout@v4

      - name: Kiểm tra dữ liệu
        id: data
        run: |
          if [ -f ai_pipeline/data/data/processed/clauses_v06.csv ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            # Push/PR cùng repo CÓ quyền secret: thiếu dữ liệu là lỗi thật (nếu không, test dữ liệu thật không
            # bao giờ chạy mà CI vẫn xanh). Chỉ PR từ fork (không có secret) mới được bỏ qua kèm cảnh báo.
            if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
              echo "::error title=Thiếu dữ liệu::Không kéo được submodule ai_pipeline/data hoặc commit ghim chưa được push lên repo data. Đặt secret SUBMODULE_TOKEN (PAT chỉ đọc) và push commit ghim."
              exit 1
            fi
            echo "::warning title=Bỏ qua test dữ liệu (PR từ fork)::Không kéo được submodule ai_pipeline/data."
          fi

      - uses: actions/setup-python@v5
        if: steps.data.outputs.available == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cài đặt
        if: steps.data.outputs.available == 'true'
        run: pip install -e '.[dev]'

      - name: pytest (test review dữ liệu + segmenter trên hợp đồng thật)
        if: steps.data.outputs.available == 'true'
        run: pytest tests/test_data_lead_review.py tests/integration

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài ruff
        run: pip install "ruff>=0.1.0"

      # Toàn repo CHẶN CỨNG (13/11/2026: `ruff check .` sạch; bỏ danh sách đường dẫn và bước "chỉ cảnh báo").
      - name: ruff check (toàn repo — bắt buộc)
        run: ruff check .

  frontend:
    name: frontend (vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

  llm-live:
    name: gọi LLM thật (thủ công)
    # Không bao giờ chạy trên PR/push (fork không có secret, và tránh tốn quota).
    if: github.event_name == 'workflow_dispatch' && inputs.run_llm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: llm   # tùy chọn: tạo Environment "llm" để đặt secret ở đó và/hoặc yêu cầu người duyệt
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
      LLM_PROVIDER: gemini
      LLM_RESULT_PATH: ${{ github.workspace }}/llm-result.json
    steps:
      - uses: actions/checkout@v4

      - name: Kiểm tra secret
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error title=Thiếu secret::Settings → Secrets and variables → Actions → New repository secret: GEMINI_API_KEY"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e '.[dev]'

      - name: pytest -m llm
        run: pytest -m llm tests/llm -s

      - name: Hiển thị kết quả
        if: always()
        run: |
          {
            echo "### Kết quả LLM (văn bản tổng hợp)"
            echo '```json'
            cat llm-result.json 2>/dev/null || echo "(không có kết quả)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llm-result
          path: llm-result.json
          if-no-files-found: ignore
          retention-days: 7
